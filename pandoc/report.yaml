from: markdown
standalone: true
toc: false
toc-depth: 4
number-sections: false
citeproc: true
template: pandoc/template/eisvogel.tex
pdf-engine: lualatex

resource-path:
  - .
  - report
  - report/assets

metadata:
  lang: es-ES
  figureTitle: "Figura"
  tableTitle: "Tabla"
  figPrefix: "Figura"
  tblPrefix: "Tabla"

variables:
  graphics: true
  multirow: true
  disable-header-and-footer: true
  block-headings: true
  geometry:
    - margin=1in
  linestretch: 1.5
  indent: true

  header-includes:
    - |
      % Viudas y huérfanas
      \clubpenalty=10000
      \widowpenalty=10000
      \displaywidowpenalty=10000
    - |
      % Sangría de 0.5 pulgadas
      \setlength{\parindent}{0.5in}
    - |
      % Alineación a la izquierda
      \AtBeginDocument{\raggedright}
    - |
      % Numeración arriba a la derecha (APA 7)
      \usepackage{fancyhdr}
      \pagestyle{fancy}
      \fancyhf{}
      \renewcommand{\headrulewidth}{0pt}
      \fancyhead[R]{\thepage}
      \fancypagestyle{plain}{
        \fancyhf{}
        \renewcommand{\headrulewidth}{0pt}
        \fancyhead[R]{\thepage}
      }
    - |
      % Quitar título automático de índice
      \makeatletter
      \renewcommand{\tableofcontents}{\@starttoc{toc}}
      \makeatother
    - |
      % Forzar a los títulos de nivel 4 (\paragraph) y nivel 5 (\subparagraph) a tener salto de línea independiente
      \makeatletter
      \renewcommand\paragraph{\@startsection{paragraph}{4}{\z@}%
        {-2.5ex\@plus -1ex \@minus -.25ex}%
        {1.25ex \@plus .2ex}%
        {\normalfont\normalsize\bfseries}}
      \renewcommand\subparagraph{\@startsection{subparagraph}{5}{\z@}%
        {-2.0ex\@plus -1ex \@minus -.25ex}%
        {1.0ex \@plus .2ex}%
        {\normalfont\normalsize\bfseries}}
      \makeatother
    - |
      \usepackage{tabularx}
      \usepackage{multirow}
      \usepackage{array}
      
      % Macros globales para encabezados de tablas complejas
      \newcommand{\thfirst}[1]{\multicolumn{1}{|c|}{\textbf{#1}}}
      \newcommand{\thcell}[1]{\multicolumn{1}{c|}{\textbf{#1}}}
      \newcommand{\thc}[1]{\multicolumn{1}{c}{\textbf{#1}}}
      \newcommand{\thspan}[2]{\multicolumn{#1}{c|}{\textbf{#2}}}
      \newcommand{\thspanfirst}[2]{\multicolumn{#1}{|c|}{\textbf{#2}}}
    - |
      % Configuración de APA 7 para Tablas y Figuras
      \usepackage{caption}
      \captionsetup{
        labelsep=newline,
        justification=raggedright,
        singlelinecheck=false,
        textfont={it, color=black},
        labelfont={bf, color=black},
        skip=10pt
      }
      \captionsetup[table]{position=top}
      \captionsetup[figure]{position=top}
      
      % Forzar el título de las figuras en la parte superior (APA 7)
      \floatstyle{plaintop}
      \restylefloat{figure}
      
      % Renombrar 'Cuadro' a 'Tabla' (ya que babel español usa Cuadro por defecto)
      \AtBeginDocument{
        \renewcommand{\tablename}{Tabla}
        \renewcommand{\listtablename}{Índice de tablas}
      }

filters:
  - pandoc-crossref

bibliography:
  - report/bibliography/references.bib

csl: pandoc/csl/apa-7.csl
